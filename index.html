<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f8a5f">
<title>每日健康记录</title>
<style>
  :root{
    --bg:#f2f6f4; --card:#ffffff; --fg:#152420; --muted:#66786f;
    --line:#dce8e1; --accent:#0f8a5f; --accent-deep:#0b6b4a; --accent-soft:#e6f6ef;
    --warn:#b97a0e; --warn-soft:#fdf3e0; --danger:#c44536;
    --radius:18px; --shadow:0 6px 22px rgba(16,42,32,.07);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{
    margin:0; padding:0 0 150px; background:
      radial-gradient(circle at 85% -5%, rgba(15,138,95,.10), transparent 32%),
      radial-gradient(circle at 0% 30%, rgba(15,138,95,.05), transparent 25%),
      linear-gradient(180deg, #f8fbf9 0%, var(--bg) 100%);
    color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    font-size:16px; line-height:1.6;
  }
  .wrap{max-width:680px; margin:0 auto; padding:0 14px}

  /* ── 顶部提醒条 ── */
  #todoBar{
    display:none; gap:8px; align-items:flex-start;
    background:var(--warn-soft); border:1px solid #f0dcb4; color:#8a5c08;
    border-radius:14px; padding:11px 14px; margin:14px 0 4px; font-size:13.5px; line-height:1.55;
  }
  #todoBar.show{display:flex}
  #todoBar .ico{flex:none}

  header.app{padding:22px 0 6px}
  h1{font-size:26px; margin:0 0 6px; letter-spacing:-.02em}
  .sub{color:var(--muted); font-size:13.5px; margin-bottom:10px}
  .progress{display:flex; align-items:center; gap:10px; margin-bottom:16px}
  .progress .track{flex:1; height:6px; border-radius:99px; background:#dfeae4; overflow:hidden}
  .progress .fill{height:100%; width:0%; border-radius:99px; background:linear-gradient(90deg,var(--accent),#2db984); transition:width .35s ease}
  .progress .pct{font-size:12.5px; color:var(--muted); min-width:74px; text-align:right}

  /* ── 手风琴卡片 ── */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:12px; box-shadow:var(--shadow); overflow:hidden;
  }
  .card-head{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:16px; border:none; background:transparent; cursor:pointer;
    font-family:inherit; font-size:16px; font-weight:700; color:var(--fg); text-align:left;
  }
  .card-head .num{
    flex:none; width:30px; height:30px; border-radius:10px; background:var(--accent-soft);
    color:var(--accent-deep); font-size:14px; font-weight:800;
    display:flex; align-items:center; justify-content:center;
  }
  .card-head .badge{
    flex:none; margin-left:auto; font-size:12px; font-weight:600; color:var(--muted);
    background:#f1f6f3; border-radius:99px; padding:3px 10px; max-width:46%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .card-head .badge.done{color:var(--accent-deep); background:var(--accent-soft)}
  .card-head .arrow{flex:none; color:var(--muted); transition:transform .25s ease; font-size:13px}
  .card.open .card-head .arrow{transform:rotate(90deg)}
  .card-body{display:none; padding:2px 16px 18px; border-top:1px solid #eef4f0}
  .card.open .card-body{display:block}

  .row{display:flex; gap:10px; flex-wrap:wrap}
  .field{flex:1 1 150px; min-width:0}
  label{display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; font-weight:500}
  label:first-child{margin-top:4px}
  input[type=text],input[type=number],input[type=time],select,textarea{
    width:100%; min-height:46px; padding:11px 13px; border:1.5px solid var(--line); border-radius:13px;
    font-size:16px; font-family:inherit; background:#fff; color:var(--fg);
  }
  textarea{min-height:80px; line-height:1.55}
  input:focus,select:focus,textarea:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);
  }
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
  .hint{font-size:12.5px; color:var(--muted); margin-top:8px}

  .seg,.chips{display:flex; gap:8px; flex-wrap:wrap}
  .seg button,.chips button,.pill{
    min-height:44px; padding:10px 16px; border:1.5px solid var(--line); background:#fff; border-radius:999px;
    font-size:14.5px; font-family:inherit; cursor:pointer; color:var(--fg);
    transition:all .15s ease;
  }
  .seg button.on,.chips button.on,.pill.on{
    background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600;
    box-shadow:0 4px 12px rgba(15,138,95,.28);
  }

  .upload{
    margin-top:14px; border:1.5px dashed #c3d8cd; border-radius:15px; padding:13px; background:#fafdfb;
  }
  .upload .title{font-size:14px; font-weight:600; margin-bottom:9px}
  .ghost{
    min-height:44px; padding:10px 16px; border:1.5px solid var(--line); background:#fff; border-radius:12px;
    font-size:14.5px; font-family:inherit; cursor:pointer; color:var(--fg);
  }
  .thumbs{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px}
  .thumb{width:92px; position:relative; border-radius:13px; overflow:hidden; border:1px solid var(--line); background:#fff}
  .thumb img{display:block; width:92px; height:92px; object-fit:cover}
  .thumb button{
    position:absolute; top:4px; right:4px; width:26px; height:26px; border:none; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; cursor:pointer; font-size:15px; line-height:1;
  }

  /* 训练矩阵 */
  .matrix-hint{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin:10px 0 0}
  .matrix-wrap{
    overflow-x:auto; -webkit-overflow-scrolling:touch; margin-top:8px;
    border:1px solid var(--line); border-radius:15px; background:#fff;
    scrollbar-width:thin;
  }
  table.matrix{width:100%; min-width:600px; border-collapse:separate; border-spacing:0}
  table.matrix th,table.matrix td{
    border-bottom:1px solid #eef4f0; border-right:1px solid #eef4f0;
    padding:9px; vertical-align:middle; text-align:left;
  }
  table.matrix th:last-child,table.matrix td:last-child{border-right:none}
  table.matrix tr:last-child td{border-bottom:none}
  table.matrix th{background:#f4f9f6; font-size:12.5px; color:var(--muted); font-weight:600; padding:10px 9px}
  table.matrix input{
    width:100%; min-width:80px; padding:10px 11px; border:1.5px solid var(--line); border-radius:11px; font-size:15px;
  }
  table.matrix .name-cell{min-width:132px}
  table.matrix .ops{white-space:nowrap}
  .ops button{
    border:none; background:#f1f6f3; color:var(--danger); border-radius:9px; padding:9px 11px; cursor:pointer; font-size:14px;
  }
  .add{
    width:100%; min-height:46px; border:1.5px dashed #b9d4c6; background:#fff; border-radius:13px; margin-top:10px;
    font-size:15px; font-family:inherit; color:var(--accent-deep); cursor:pointer; font-weight:600;
  }

  .meal-item{
    border:1px solid var(--line); border-radius:15px; padding:13px; margin-bottom:10px; background:#fcfefd;
  }
  .meal-item .meal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:4px}
  .meal-item .meal-head strong{font-size:13.5px; color:var(--muted); font-weight:600}
  .meal-item .del{
    border:none; background:#fdf0ee; color:var(--danger); border-radius:9px; min-height:36px; padding:6px 12px;
    font-size:13px; cursor:pointer; font-family:inherit;
  }

  /* 快捷模式条 */
  .quick-strip{
    display:flex; gap:8px; align-items:center; flex-wrap:wrap;
    background:linear-gradient(90deg, #effaf4, #f2fbf7); border:1px solid #cfe9db;
    border-radius:15px; padding:12px 14px; margin-bottom:14px;
  }
  .quick-strip .t{font-size:13.5px; font-weight:600; color:var(--accent-deep)}
  .quick-strip button{
    min-height:38px; padding:7px 14px; border-radius:99px; border:1.5px solid var(--accent);
    background:#fff; color:var(--accent-deep); font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }

  /* 底部操作栏 */
  footer{
    position:fixed; left:0; right:0; bottom:0; z-index:50;
    padding:10px 14px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(242,246,244,.99) 62%, rgba(242,246,244,0));
  }
  footer .bar{max-width:680px; margin:0 auto; display:flex; gap:10px; align-items:stretch}
  .btn{
    padding:15px 18px; border-radius:15px; border:none; font-size:16.5px; font-weight:700;
    font-family:inherit; cursor:pointer; min-height:52px;
  }
  .btn.primary{
    flex:1; background:linear-gradient(135deg, var(--accent), var(--accent-deep)); color:#fff;
    box-shadow:0 8px 22px rgba(15,138,95,.32);
  }
  .btn.primary:active{transform:translateY(1px)}
  .btn.icon{
    flex:none; width:52px; background:#fff; border:1.5px solid var(--line); color:var(--muted);
    font-size:19px; border-radius:15px; padding:0;
  }

  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    background:#152420; color:#fff; padding:12px 18px; border-radius:12px; font-size:14.5px;
    opacity:0; pointer-events:none; transition:opacity .25s; z-index:99; max-width:88vw; text-align:center;
    box-shadow:0 10px 28px rgba(0,0,0,.25);
  }
  .toast.show{opacity:1}

  /* 记录卡 */
  .record-card{
    display:none; margin:6px auto 16px; max-width:560px;
    background:linear-gradient(150deg, #10402f, #0b2f22); color:#f7fff9;
    border-radius:24px; padding:24px; box-shadow:0 16px 40px rgba(10,42,30,.30);
  }
  .record-card.show{display:block; animation:pop .3s ease}
  @keyframes pop{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
  .record-card .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
  .record-card h3{font-size:22px;margin:0;letter-spacing:-.03em}
  .record-card .card-date{font-size:13px;color:#a9d3bf;margin-top:2px}
  .record-card .spark{font-size:20px}
  .record-card .card-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .record-card .card-item{background:rgba(255,255,255,.10);padding:11px 13px;border-radius:13px;font-size:13.5px}
  .record-card .card-item b{display:block;font-size:11px;color:#a9d3bf;margin-bottom:3px;font-weight:500}
  .record-card .card-block{border-top:1px solid rgba(255,255,255,.16);margin-top:14px;padding-top:13px;font-size:13.5px;line-height:1.7}
  .record-card .card-block b{color:#a9d3bf;font-size:11px;font-weight:500}
  .record-card .card-empty{color:#a9d3bf}
  .card-actions{display:none;gap:10px;max-width:560px;margin:0 auto 16px}
  .card-actions.show{display:flex}
  .card-actions .btn{flex:1}
  .card-actions .btn.ghost{background:#fff;border:1.5px solid var(--line);color:var(--fg);font-size:15px}

  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (max-width:640px){
    h1{font-size:23px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="app">
    <h1>每日健康记录</h1>
    <div class="sub">填完点底部「生成记录」→ 去微信粘贴给小克，图片直接微信原图发</div>
    <div class="progress">
      <div class="track"><div class="fill" id="progFill"></div></div>
      <div class="pct" id="progText">0% 已填</div>
    </div>
  </header>

  <div id="todoBar"><span class="ico">📝</span><span id="todoText"></span></div>

  <div class="quick-strip">
    <span class="t">⚡ 赶时间？</span>
    <button type="button" onclick="quickDefault()">一键默认日</button>
    <button type="button" onclick="loadLastWorkout()">套用上次训练</button>
  </div>

  <!-- 1 身体数据 -->
  <section class="card open" id="card-body">
    <button class="card-head" type="button" onclick="toggleCard('card-body')">
      <span class="num">1</span>身体数据
      <span class="badge" data-badge></span><span class="arrow">▶</span>
    </button>
    <div class="card-body">
      <div class="row">
        <div class="field">
          <label for="weight">体重（斤，可多个用逗号分隔）</label>
          <input id="weight" type="text" inputmode="decimal" placeholder="如 168.2 或 168.2,167.8" oninput="onInput()">
        </div>
        <div class="field">
          <label for="waist">腰围（cm，周一测）</label>
          <input id="waist" type="number" step="0.5" inputmode="decimal" placeholder="如 102" oninput="onInput()">
        </div>
      </div>
      <div class="row" style="margin-top:2px">
        <div class="field">
          <label for="date">记录日期</label>
          <input id="date" type="text" placeholder="YYYY-MM-DD" oninput="onInput()">
        </div>
        <div class="field" style="flex:0 0 auto; align-self:flex-end">
          <button class="ghost" type="button" onclick="setToday()">今天</button>
        </div>
      </div>
      <div class="hint">体重填「斤」即可，小克自动换算 kg 落账</div>
    </div>
  </section>

  <!-- 2 睡眠 -->
  <section class="card" id="card-sleep">
    <button class="card-head" type="button" onclick="toggleCard('card-sleep')">
      <span class="num">2</span>睡眠
      <span class="badge" data-badge></span><span class="arrow">▶</span>
    </button>
    <div class="card-body">
      <div class="row">
        <div class="field">
          <label for="bedtime">入睡</label>
          <input id="bedtime" type="time" oninput="onInput()">
        </div>
        <div class="field">
          <label for="waketime">起床</label>
          <input id="waketime" type="time" oninput="onInput()">
        </div>
      </div>
      <label>睡眠质量</label>
      <div class="seg" id="sleepQuality">
        <button type="button" data-v="好">好</button>
        <button type="button" data-v="一般">一般</button>
        <button type="button" data-v="差">差</button>
      </div>
      <label for="sleepNote">备注</label>
      <input id="sleepNote" type="text" placeholder="夜醒、打鼾、做梦等，可留空" oninput="onInput()">
      <div class="upload">
        <div class="title">📷 睡眠截图</div>
        <input class="visually-hidden" id="sleepImages" type="file" accept="image/*" multiple>
        <button class="ghost" type="button" onclick="Q('sleepImages').click()">选择图片</button>
        <div class="thumbs" id="sleepThumbs"></div>
        <div class="hint">可直接传手表睡眠数据图，小克会识别时长/深睡/评分</div>
      </div>
    </div>
  </section>

  <!-- 3 骑行/运动 -->
  <section class="card" id="card-commute">
    <button class="card-head" type="button" onclick="toggleCard('card-commute')">
      <span class="num">3</span>骑行 / 运动
      <span class="badge" data-badge></span><span class="arrow">▶</span>
    </button>
    <div class="card-body">
      <div class="row">
        <div class="field">
          <label for="bikeAM">早骑行（km）</label>
          <input id="bikeAM" type="number" step="0.5" inputmode="decimal" placeholder="没骑留空" oninput="onInput()">
        </div>
        <div class="field">
          <label for="bikePM">晚骑行（km）</label>
          <input id="bikePM" type="number" step="0.5" inputmode="decimal" placeholder="没骑留空" oninput="onInput()">
        </div>
      </div>
      <label>通勤方式</label>
      <div class="seg" id="commuteMode">
        <button type="button" data-v="骑行">骑行</button>
        <button type="button" data-v="地铁">地铁</button>
        <button type="button" data-v="步行">步行</button>
        <button type="button" data-v="打车/网约车">打车</button>
        <button type="button" data-v="居家">居家</button>
        <button type="button" data-v="其他">其他</button>
      </div>
      <div class="upload">
        <div class="title">📷 骑行 / 运动截图</div>
        <input class="visually-hidden" id="activityImages" type="file" accept="image/*" multiple>
        <button class="ghost" type="button" onclick="Q('activityImages').click()">选择图片</button>
        <div class="thumbs" id="activityThumbs"></div>
        <div class="hint">手表骑行页、运动总结页、心率图都可以传</div>
      </div>
    </div>
  </section>

  <!-- 4 训练 -->
  <section class="card" id="card-exercise">
    <button class="card-head" type="button" onclick="toggleCard('card-exercise')">
      <span class="num">4</span>训练
      <span class="badge" data-badge></span><span class="arrow">▶</span>
    </button>
    <div class="card-body">
      <label>今天练了什么</label>
      <div class="seg" id="exType">
        <button type="button" data-v="gym">健身</button>
        <button type="button" data-v="swim">游泳</button>
        <button type="button" data-v="cardio">有氧</button>
        <button type="button" data-v="none">没练</button>
      </div>

      <div id="gymBox" style="display:none; margin-top:14px">
        <div class="row">
          <div class="field">
            <label for="exDur">时长（分钟）</label>
            <input id="exDur" type="number" inputmode="numeric" placeholder="如 40" oninput="onInput()">
          </div>
          <div class="field">
            <label for="exRpe">发力感 RPE（1-10）</label>
            <input id="exRpe" type="number" min="1" max="10" inputmode="numeric" placeholder="如 7" oninput="onInput()">
          </div>
        </div>

        <label>预设模板</label>
        <div class="chips" id="planChips">
          <button type="button" class="pill" data-plan="A">力量A · 推+核心</button>
          <button type="button" class="pill" data-plan="B">力量B · 拉+核心</button>
          <button type="button" class="pill" data-plan="clear">清空动作</button>
        </div>
        <div class="hint">模板只预填动作名；重量×次数按当天实际填。「套用上次训练」会连重量一起带过来。</div>

        <div class="matrix-hint"><span>👈 左右滑动填各组</span></div>
        <div class="matrix-wrap">
          <table class="matrix" aria-label="训练矩阵">
            <thead><tr>
              <th class="name-cell">动作</th><th>第1组</th><th>第2组</th><th>第3组</th><th>第4组</th><th></th>
            </tr></thead>
            <tbody id="matrixBody"></tbody>
          </table>
        </div>
        <button class="add" type="button" onclick="addMatrixRow()">+ 加一个动作</button>

        <label>练后感受</label>
        <div class="seg" id="exFeel">
          <button type="button" data-v="轻松">轻松</button>
          <button type="button" data-v="刚好">刚好</button>
          <button type="button" data-v="偏累">偏累</button>
          <button type="button" data-v="很累">很累</button>
        </div>
      </div>

      <label for="exNote">训练备注</label>
      <input id="exNote" type="text" placeholder="某个动作不适、缩短组数等，可留空" oninput="onInput()">
      <div class="upload">
        <div class="title">📷 训练截图（可选）</div>
        <input class="visually-hidden" id="trainingImages" type="file" accept="image/*" multiple>
        <button class="ghost" type="button" onclick="Q('trainingImages').click()">选择图片</button>
        <div class="thumbs" id="trainingThumbs"></div>
      </div>
    </div>
  </section>

  <!-- 5 饮食 -->
  <section class="card" id="card-meals">
    <button class="card-head" type="button" onclick="toggleCard('card-meals')">
      <span class="num">5</span>饮食
      <span class="badge" data-badge></span><span class="arrow">▶</span>
    </button>
    <div class="card-body">
      <div id="mealList"></div>
      <button class="add" type="button" onclick="addMeal()">+ 加一餐</button>
    </div>
  </section>

  <!-- 6 其他 -->
  <section class="card" id="card-notes">
    <button class="card-head" type="button" onclick="toggleCard('card-notes')">
      <span class="num">6</span>其他
      <span class="badge" data-badge></span><span class="arrow">▶</span>
    </button>
    <div class="card-body">
      <label for="notes">今天的整体状态 / 想说的话</label>
      <textarea id="notes" placeholder="精神、情绪、饿感、任何想记的" oninput="onInput()"></textarea>
    </div>
  </section>

  <section id="recordCard" class="record-card" aria-live="polite"></section>
  <div id="cardActions" class="card-actions">
    <button class="btn ghost" type="button" onclick="copyRecord()">复制记录文字</button>
    <button class="btn primary" type="button" onclick="downloadCard()">保存记录卡</button>
  </div>
</div>

<footer>
  <div class="bar">
    <button class="btn icon" type="button" onclick="resetForm()" aria-label="清空全部">🗑️</button>
    <button class="btn primary" id="submitBtn" type="button" onclick="submitForm()">生成记录并复制</button>
  </div>
</footer>
<div class="toast" id="toast"></div>

<script>
const Q = id => document.getElementById(id);
const PLANS = {
  A: ['坐姿推胸', '高位下拉', '腹肌训练', '平板支撑'],
  B: ['坐姿划船', '二头弯举', '腹肌训练', '平板支撑'],
};
const uploads = { sleep: [], activity: [], training: [], meal_breakfast: [], meal_lunch: [], meal_dinner: [] };
const LS_DRAFT = 'health-record-draft-v2';
const LS_LAST_WORKOUT = 'health-last-workout-v1';

const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
};

/* ── 手风琴 ── */
function toggleCard(id){
  const c = Q(id);
  const opening = !c.classList.contains('open');
  c.classList.toggle('open', opening);
  if(opening) c.querySelector('.card-body').scrollIntoView({behavior:'smooth', block:'start'});
}
function openCard(id){ Q(id).classList.add('open'); }

/* ── 分段选择 ── */
function initSeg(id, onPick){
  const box = Q(id); if(!box) return;
  box.addEventListener('click', e => {
    const btn = e.target.closest('button[data-v]');
    if(!btn) return;
    const already = btn.classList.contains('on');
    [...box.querySelectorAll('button')].forEach(b => b.classList.remove('on'));
    if(!already) btn.classList.add('on');          // 再点一次可取消
    if(onPick) onPick(already ? null : btn.dataset.v);
    onInput();
  });
}
function segVal(id){ const on = Q(id)?.querySelector('button.on'); return on ? on.dataset.v : null; }
function setSeg(id, v){
  [...Q(id).querySelectorAll('button')].forEach(b => b.classList.toggle('on', b.dataset.v === v));
}

/* ── 图片 ── */
function renderThumbs(kind){
  const box = Q(kind + 'Thumbs'); box.innerHTML = '';
  uploads[kind].forEach((item, idx) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img alt="${kind} 预览 ${idx+1}" src="${item.url}"><button type="button" aria-label="删除图片">×</button>`;
    div.querySelector('button').onclick = () => {
      URL.revokeObjectURL(item.url);
      uploads[kind].splice(idx, 1);
      renderThumbs(kind);
    };
    box.appendChild(div);
  });
}
function bindUploader(inputId, kind){
  Q(inputId).addEventListener('change', e => {
    [...e.target.files].forEach(file => {
      if(!file.type.startsWith('image/')) return;
      uploads[kind].push({ file, url: URL.createObjectURL(file) });
    });
    e.target.value = '';
    renderThumbs(kind);
    if(uploads[kind].length) toast('图片已加（仅本地预览），最终请微信原图发给小克');
  });
}

/* ── 训练矩阵 ── */
function addMatrixRow(name=''){
  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td class="name-cell"><input class="m-name" type="text" value="${name.replace(/"/g,'&quot;')}" placeholder="动作名"></td>
    <td><input class="m-g" type="text" placeholder="20×12"></td>
    <td><input class="m-g" type="text" placeholder="20×12"></td>
    <td><input class="m-g" type="text" placeholder="20×12"></td>
    <td><input class="m-g" type="text" placeholder="可选"></td>
    <td class="ops"><button type="button" aria-label="删除动作">删</button></td>`;
  tr.querySelector('.ops button').onclick = () => { tr.remove(); onInput(); };
  tr.querySelectorAll('input').forEach(i => i.addEventListener('input', onInput));
  Q('matrixBody').appendChild(tr);
}
function loadPlan(plan){
  Q('matrixBody').innerHTML = '';
  if(plan === 'clear') return;
  (PLANS[plan] || []).forEach(name => addMatrixRow(name));
}
function parseGroup(text){
  const raw = (text || '').trim(); if(!raw) return null;
  let m = raw.match(/^(\d+(?:\.\d+)?)\s*[x×*]\s*(\d+)$/i);
  if(m) return { weight_kg: Number(m[1]), reps: Number(m[2]), raw };
  m = raw.match(/^(\d+(?:\.\d+)?)\s*(s|秒)$/i);
  if(m) return { seconds: Number(m[1]), raw };
  m = raw.match(/^(\d+)$/);
  if(m) return { reps: Number(m[1]), raw };
  return { raw };
}
function collectMatrix(){
  const rows = [];
  Q('matrixBody').querySelectorAll('tr').forEach(tr => {
    const name = tr.querySelector('.m-name').value.trim(); if(!name) return;
    const groups = [...tr.querySelectorAll('.m-g')].map(i => parseGroup(i.value)).filter(Boolean);
    rows.push({ name, groups });
  });
  return rows;
}
function loadLastWorkout(){
  try{
    const last = JSON.parse(localStorage.getItem(LS_LAST_WORKOUT) || 'null');
    if(!last?.length){ toast('还没存过训练记录，先完整提交一次就有了'); return; }
    Q('matrixBody').innerHTML = '';
    last.forEach(r => {
      addMatrixRow(r.name);
      const tr = Q('matrixBody').lastElementChild;
      (r.groups || []).forEach((g, i) => {
        const inp = tr.querySelectorAll('.m-g')[i];
        if(inp && g.raw) inp.value = g.raw;
      });
    });
    setSeg('exType','gym'); Q('gymBox').style.display='block';
    openCard('card-exercise');
    toast(`已套用上次训练（${last.length} 个动作），重量按今天状态调`);
  }catch(e){ toast('读取上次训练失败'); }
}

/* ── 饮食：固定三餐 ── */
function addMeal(key, time){
  const label = {'breakfast':'早餐','lunch':'午餐','dinner':'晚餐'}[key];
  const div = document.createElement('div');
  div.className = 'meal-item';
  div.dataset.meal = key;
  div.innerHTML = `
    <div class="meal-head">
      <strong>${label}</strong>
    </div>
    <div class="row">
      <div class="field" style="flex:0 1 120px">
        <label>时间</label>
        <input class="m-time" type="time" value="${time}">
      </div>
      <div class="field">
        <label>油盐感觉（可选）</label>
        <select class="m-oily">
          <option value="">不确定/不填</option>
          <option>清淡</option><option>正常</option><option>偏咸偏油</option>
        </select>
      </div>
    </div>
    <label>吃了什么</label>
    <textarea class="m-content" style="min-height:56px" placeholder="如 米饭半碗、清蒸鲈鱼、炒青菜；蛋白和蔬菜小克看内容+图估算"></textarea>
    <div class="upload">
      <div class="title">📷 ${label}照片（可选）</div>
      <input class="visually-hidden" id="meal-${key}-images" type="file" accept="image/*" multiple>
      <button class="ghost" type="button" onclick="Q('meal-${key}-images').click()">选择图片</button>
      <div class="thumbs" id="meal-${key}-thumbs"></div>
      <div class="hint">拍下这餐即可，小克结合文字+照片估蛋白/蔬菜量</div>
    </div>`;
  div.querySelectorAll('input,select,textarea').forEach(i => i.addEventListener('input', onInput));
  Q('mealList').appendChild(div);
}

/* ── 收集 ── */
function collect(){
  const payload = { date: Q('date').value.trim() || today() };
  const wRaw = Q('weight').value.trim();
  if(wRaw){
    const arr = wRaw.split(/[,，\s]+/).filter(Boolean).map(Number).filter(v => !isNaN(v))
      .map(jin => Math.round(jin / 2 * 100) / 100);
    if(arr.length) payload.weight_kg = arr;
  }
  if(Q('waist').value.trim()) payload.waist_cm = Number(Q('waist').value);

  const sleep = {};
  if(Q('bedtime').value) sleep.bedtime = Q('bedtime').value;
  if(Q('waketime').value) sleep.waketime = Q('waketime').value;
  if(segVal('sleepQuality')) sleep.quality = segVal('sleepQuality');
  if(Q('sleepNote').value.trim()) sleep.note = Q('sleepNote').value.trim();
  if(Object.keys(sleep).length) payload.sleep = sleep;

  const commute = {};
  if(Q('bikeAM').value) commute.morning_bike_km = Number(Q('bikeAM').value);
  if(Q('bikePM').value) commute.evening_bike_km = Number(Q('bikePM').value);
  if(segVal('commuteMode')) commute.mode_note = segVal('commuteMode');
  if(Object.keys(commute).length) payload.commute = commute;

  const ex = {};
  const t = segVal('exType');
  if(t === 'none'){ ex.gym = false; ex.swim = false; }
  else if(t){
    ex.gym = t === 'gym'; ex.swim = t === 'swim';
    if(t === 'cardio') ex.other = '有氧';
  }
  if(Q('exDur').value) ex.duration_min = Number(Q('exDur').value);
  if(Q('exRpe').value) ex.rpe = Number(Q('exRpe').value);
  if(segVal('exFeel')) ex.feel = segVal('exFeel');
  if(Q('exNote').value.trim()) ex.note = Q('exNote').value.trim();
  const detail = collectMatrix();
  if(detail.length) ex.detail = detail;
  if(Object.keys(ex).length) payload.exercise = ex;

  const meals = [];
  Q('mealList').querySelectorAll('.meal-item').forEach(it => {
    const content = it.querySelector('.m-content').value.trim();
    if(!content) return;   // 没写内容就不算这餐
    const m = { type: {'breakfast':'早餐','lunch':'午餐','dinner':'晚餐'}[it.dataset.meal],
                time: it.querySelector('.m-time').value, content };
    const o = it.querySelector('.m-oily').value;
    if(o) m.oily_salty = o;
    meals.push(m);
  });
  if(meals.length) payload.meals = meals;
  if(Q('notes').value.trim()) payload.notes = [Q('notes').value.trim()];
  return payload;
}

/* ── 进度 + 待补提醒 + 徽标 ── */
const PROGRESS_FIELDS = ['weight','waist','bedtime','waketime','bikeAM','bikePM','exDur','exRpe','exNote','notes'];
function onInput(){
  let filled = 0, total = 0;
  PROGRESS_FIELDS.forEach(id => { total++; if(Q(id)?.value?.trim()) filled++; });
  ['sleepQuality','commuteMode','exType','exFeel'].forEach(id => { total++; if(segVal(id)) filled++; });
  total++; if([...Q('mealList').querySelectorAll('.m-content')].some(t=>t.value.trim())) filled++;
  const pct = Math.round(filled / total * 100);
  Q('progFill').style.width = pct + '%';
  Q('progText').textContent = pct + '% 已填';

  const badges = {
    'card-body': (Q('weight').value.trim() || Q('waist').value.trim()) ? '已填' : '',
    'card-sleep': (Q('bedtime').value || Q('waketime').value || segVal('sleepQuality')) ? '已填' : '',
    'card-commute': (Q('bikeAM').value || Q('bikePM').value || segVal('commuteMode')) ? '已填' : '',
    'card-exercise': (segVal('exType') || collectMatrix().length) ? '已填' : '',
    'card-meals': [...Q('mealList').querySelectorAll('.m-content')].some(t=>t.value.trim()) ? '已填' : '',
    'card-notes': Q('notes').value.trim() ? '已填' : '',
  };
  Object.entries(badges).forEach(([cid, txt]) => {
    const b = Q(cid).querySelector('.badge');
    b.textContent = txt; b.classList.toggle('done', !!txt);
  });

  const todos = [];
  if(!Q('bedtime').value && !Q('waketime').value) todos.push('睡眠时间');
  if(!segVal('commuteMode')) todos.push('通勤方式');
  if(![...Q('mealList').querySelectorAll('.m-content')].some(t=>t.value.trim())) todos.push('饮食');
  const bar = Q('todoBar');
  if(todos.length && pct < 100){
    Q('todoText').textContent = `还差：${todos.join('、')}（图片可微信原图发，网页里可跳过）`;
    bar.classList.add('show');
  } else bar.classList.remove('show');

  saveDraft();
}

/* ── 快捷默认日 ── */
function quickDefault(){
  setSeg('commuteMode','骑行');
  if(!Q('bikeAM').value) Q('bikeAM').value = 12;
  if(!Q('bikePM').value) Q('bikePM').value = 12;
  Q('mealList').innerHTML = '';
  addMeal('breakfast','08:00'); addMeal('lunch','12:00'); addMeal('dinner','19:00');
  setSeg('exType','none');
  toast('默认日已填：通勤骑行+三餐占位，改完实际数据再提交');
  onInput();
}

/* ── toast ── */
function toast(msg, ms=3000){
  if(!msg) return;
  const t = Q('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* ── 记录卡 ── */
function escapeHtml(s){ return String(s ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
function formatRecord(payload){
  const lines = [`【健康记录｜${payload.date}】`];
  if(payload.weight_kg?.length) lines.push(`体重：${payload.weight_kg.map(x => (x*2).toFixed(1).replace(/\.0$/,'')+'斤').join(' / ')}`);
  if(payload.waist_cm) lines.push(`腰围：${payload.waist_cm}cm`);
  const s = payload.sleep || {};
  if(Object.keys(s).length) lines.push(`睡眠：${[s.bedtime && s.waketime ? s.bedtime+'–'+s.waketime : '',s.quality,s.note].filter(Boolean).join('｜')}`);
  const c = payload.commute || {};
  if(Object.keys(c).length) lines.push(`通勤：${[c.mode_note,c.morning_bike_km!=null?'早骑'+c.morning_bike_km+'km':'',c.evening_bike_km!=null?'晚骑'+c.evening_bike_km+'km':''].filter(Boolean).join('｜')}`);
  const ex = payload.exercise || {};
  if(Object.keys(ex).length){
    const type = ex.gym ? '健身' : ex.swim ? '游泳' : ex.other || (ex.gym===false && ex.swim===false ? '未训练' : '运动');
    lines.push(`训练：${[type,ex.duration_min ? ex.duration_min+'分钟':'',ex.rpe ? 'RPE '+ex.rpe:'',ex.feel].filter(Boolean).join('｜')}`);
    (ex.detail||[]).forEach(row => { const g=(row.groups||[]).map(x=>x.raw).filter(Boolean).join(' / '); if(row.name) lines.push(`- ${row.name}${g ? '：'+g : ''}`); });
    if(ex.note) lines.push(`训练备注：${ex.note}`);
  }
  if(payload.meals?.length){ lines.push('饮食：'); payload.meals.forEach(m => lines.push(`- ${m.type}${m.time?'（'+m.time+'）':''}：${m.content || '未填写'}${m.oily_salty?'｜油盐'+m.oily_salty:''}`)); }
  if(payload.notes?.[0]) lines.push(`备注：${payload.notes[0]}`);
  return lines.join('\n');
}
function renderRecordCard(payload, text){
  const card=Q('recordCard'); const s=payload.sleep||{}, c=payload.commute||{}, ex=payload.exercise||{};
  const type=ex.gym?'健身':ex.swim?'游泳':ex.other||(ex.gym===false&&ex.swim===false?'未训练':'未记录');
  const items=[['体重',payload.weight_kg?.length?payload.weight_kg.map(x=>(x*2).toFixed(1).replace(/\.0$/,'')+'斤').join(' / '):'未记录'],['睡眠',s.bedtime&&s.waketime?s.bedtime+'–'+s.waketime:(s.quality||'未记录')],['通勤',c.mode_note||'未记录'],['训练',[type,ex.duration_min&&ex.duration_min+'分钟'].filter(Boolean).join('｜')||'未记录']];
  const meals=(payload.meals||[]).map(m=>`<div>· ${escapeHtml(m.type)}：${escapeHtml(m.content||'未填写')}</div>`).join('') || '<span class="card-empty">未记录</span>';
  const train=(ex.detail||[]).map(r=>`<div>· ${escapeHtml(r.name)}${r.groups?.length?'：'+escapeHtml(r.groups.map(g=>g.raw).filter(Boolean).join(' / ')):''}</div>`).join('') || '<span class="card-empty">未记录</span>';
  card.innerHTML=`<div class="card-head"><div><h3>今日健康记录</h3><div class="card-date">${escapeHtml(payload.date)} · 小克健康台账</div></div><div class="spark">✦</div></div><div class="card-grid">${items.map(([k,v])=>`<div class="card-item"><b>${k}</b>${escapeHtml(v)}</div>`).join('')}</div><div class="card-block"><b>训练明细</b>${train}</div><div class="card-block"><b>饮食</b>${meals}</div>${payload.notes?.[0]?`<div class="card-block"><b>备注</b><div>${escapeHtml(payload.notes[0])}</div></div>`:''}`;
  card.dataset.text=text; card.classList.add('show'); Q('cardActions').classList.add('show');
  card.scrollIntoView({behavior:'smooth',block:'start'});
}
async function copyRecord(){ const text=Q('recordCard').dataset.text||''; try{ await navigator.clipboard.writeText(text); toast('已复制，去微信粘贴给小克'); }catch(e){ toast('复制失败，请长按记录卡文字选择复制'); } }
function downloadCard(){ const text=Q('recordCard').dataset.text||''; const blob=new Blob([text],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`健康记录-${Q('date').value||today()}.txt`; a.click(); URL.revokeObjectURL(a.href); toast('已保存 txt'); }

/* ── 草稿 ── */
function snapshotState(){
  const meals = [...Q('mealList').querySelectorAll('.meal-item')].map(it => ({
    key: it.dataset.meal,
    time: it.querySelector('.m-time').value,
    content: it.querySelector('.m-content').value,
    o: it.querySelector('.m-oily').value,
  }));
  const matrix = [...Q('matrixBody').querySelectorAll('tr')].map(tr => ({
    name: tr.querySelector('.m-name').value,
    g: [...tr.querySelectorAll('.m-g')].map(i => i.value),
  }));
  return {
    date: Q('date').value, weight: Q('weight').value, waist: Q('waist').value,
    bedtime: Q('bedtime').value, waketime: Q('waketime').value, sleepNote: Q('sleepNote').value,
    bikeAM: Q('bikeAM').value, bikePM: Q('bikePM').value,
    exDur: Q('exDur').value, exRpe: Q('exRpe').value, exNote: Q('exNote').value, notes: Q('notes').value,
    segs: { sleepQuality: segVal('sleepQuality'), commuteMode: segVal('commuteMode'), exType: segVal('exType'), exFeel: segVal('exFeel') },
    meals, matrix,
  };
}
function saveDraft(){ try{ localStorage.setItem(LS_DRAFT, JSON.stringify(snapshotState())); }catch(e){} }
function restoreDraft(){
  try{
    const d = JSON.parse(localStorage.getItem(LS_DRAFT) || 'null');
    if(!d) return false;
    ['date','weight','waist','bedtime','waketime','sleepNote','bikeAM','bikePM','exDur','exRpe','exNote','notes']
      .forEach(k => { if(d[k] != null) Q(k).value = d[k]; });
    Object.entries(d.segs || {}).forEach(([id, v]) => v && setSeg(id, v));
    (d.matrix || []).forEach(r => {
      addMatrixRow(r.name || '');
      const tr = Q('matrixBody').lastElementChild;
      (r.g || []).forEach((v, i) => { const inp = tr.querySelectorAll('.m-g')[i]; if(inp) inp.value = v; });
    });
    (d.meals || []).forEach(m => {
      const it = Q('mealList').querySelector(`[data-meal="${m.key}"]`);
      if(!it) return;
      if(m.time) it.querySelector('.m-time').value = m.time;
      it.querySelector('.m-content').value = m.content || '';
      if(m.o) it.querySelector('.m-oily').value = m.o;
    });
    if(d.segs?.exType === 'gym' || d.segs?.exType === 'cardio') Q('gymBox').style.display = 'block';
    return true;
  }catch(e){ return false; }
}

/* ── 提交 ── */
async function submitForm(){
  const payload = collect();
  if(payload.exercise?.detail?.length){
    try{ localStorage.setItem(LS_LAST_WORKOUT, JSON.stringify(payload.exercise.detail)); }catch(e){}
  }
  saveDraft();
  const text = formatRecord(payload);
  renderRecordCard(payload, text);
  try{ await navigator.clipboard.writeText(text); toast('记录已生成并复制 → 打开微信粘贴给小克，图片记得原图发'); }
  catch(e){ toast('记录已生成：点下方「复制记录文字」后发微信'); }
}

function setToday(){ Q('date').value = today(); }
function resetForm(){
  if(!confirm('确定清空所有已填内容？')) return;
  ['weight','waist','bedtime','waketime','sleepNote','bikeAM','bikePM','exDur','exRpe','exNote','notes']
    .forEach(id => Q(id).value = '');
  ['sleepQuality','commuteMode','exType','exFeel'].forEach(id =>
    Q(id).querySelectorAll('button').forEach(b => b.classList.remove('on')));
  Object.keys(uploads).forEach(k => { uploads[k].forEach(x => URL.revokeObjectURL(x.url)); uploads[k] = []; renderThumbs(k); });
  Q('matrixBody').innerHTML = '';
  Q('mealList').innerHTML = '';
  Q('gymBox').style.display = 'none';
  try{ localStorage.removeItem(LS_DRAFT); }catch(e){}
  setToday(); addMeal('breakfast','08:00'); addMeal('lunch','12:00'); addMeal('dinner','19:00');
  document.querySelectorAll('.card').forEach(c => c.classList.remove('open'));
  Q('card-body').classList.add('open');
  onInput();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ── 初始化 ── */
initSeg('sleepQuality');
initSeg('commuteMode');
initSeg('exFeel');
initSeg('exType', v => {
  Q('gymBox').style.display = (v === 'gym' || v === 'cardio') ? 'block' : 'none';
  if((v === 'gym' || v === 'cardio') && !Q('matrixBody').children.length) addMatrixRow();
});
Q('planChips').addEventListener('click', e => {
  const btn = e.target.closest('button[data-plan]'); if(!btn) return;
  loadPlan(btn.dataset.plan); onInput();
});
bindUploader('sleepImages','sleep');
bindUploader('activityImages','activity');
bindUploader('trainingImages','training');
bindUploader('meal-breakfast-images','meal_breakfast');
bindUploader('meal-lunch-images','meal_lunch');
bindUploader('meal-dinner-images','meal_dinner');
document.addEventListener('change', e => { if(e.target.matches('select')) onInput(); });

const hadDraft = restoreDraft();
if(!hadDraft){
  setToday();
  addMeal('breakfast','08:00'); addMeal('lunch','12:00'); addMeal('dinner','19:00');
}
onInput();
</script>
</body>
</html>
